name: Conan Package OpenOCD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v7

      - name: Set up Conda environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: zephyr-build
          cache-environment: true
          cache-downloads: true

      - name: Verify tools
        shell: bash -l {0}
        run: |
          which python && python --version
          which west && west --version
          which conan && conan --version
          which arm-none-eabi-gcc || echo "(target gcc comes from zephyr-sdk package)"

      - name: Use isolated Conan home
        shell: bash
        run: echo "CONAN_HOME=$RUNNER_TEMP/conan-home" >> "$GITHUB_ENV"

      - name: Detect Conan profile
        shell: bash -l {0}
        run: conan profile detect --force

      - name: Conan create openocd
        shell: bash -l {0}
        run: |
          conan create ./package/openocd --build=missing

      - name: Prepare Conan package payload
        shell: bash -l {0}
        run: |
          version="$(conan inspect ./package/openocd --format=json | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          deploy_dir="$RUNNER_TEMP/openocd-deploy"
          conan install --requires="openocd/${version}" \
            --build=missing \
            --deployer=full_deploy \
            --deployer-folder="$deploy_dir"
          tar -czf openocd.tar.gz -C "$deploy_dir" full_deploy

      - name: Publish Conan package release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: conan-openocd
          name: Conan package - openocd
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: openocd.tar.gz

      - name: Clean Conan cache
        shell: bash -l {0}
        run: conan cache clean "openocd/*" --source --build
